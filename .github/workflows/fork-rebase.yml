name: Fork Daily Rebase

# Mirrors upstream master to the upstream branch, then rebases the fork's patch stack onto it and pushes the result to
# the auto-rebase branch. That push runs fork-ci.yml, which opens an issue if the build or tests fail. A conflict opens
# an issue directly. When CI passes on auto-rebase, fork-ci.yml moves master to it.
#
# Pushing commits that touch .github/workflows needs a token with the "workflows" permission, which GITHUB_TOKEN can
# never have, and pushes made with GITHUB_TOKEN do not start other workflows. So the pushes use FORK_REBASE_TOKEN: a
# fine-grained personal access token for this repository with "Contents" and "Workflows" set to read and write.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      stack_branch:
        description: 'Branch holding the patch stack'
        default: 'master'
      upstream_ref:
        description: 'Upstream ref to rebase onto (a scratch ref can be given to test the conflict path)'
        default: 'master'
      update_mirror:
        description: 'Update the upstream mirror branch'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rebase:
    if: github.repository_owner != 'LadybirdBrowser'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write

    env:
      STACK_BRANCH: ${{ inputs.stack_branch || 'master' }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'master' }}
      UPDATE_MIRROR: ${{ github.event_name == 'schedule' || inputs.update_mirror }}

    steps:
      - name: Check for the push token
        env:
          FORK_REBASE_TOKEN: ${{ secrets.FORK_REBASE_TOKEN }}
        run: |
          if [[ -z "${FORK_REBASE_TOKEN}" ]]; then
            echo "::error::The FORK_REBASE_TOKEN secret is not set; see the comment at the top of fork-rebase.yml"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.STACK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_REBASE_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LadybirdBrowser/ladybird.git
          git fetch --no-tags upstream "${UPSTREAM_REF}"
          git update-ref refs/fork/upstream FETCH_HEAD
          echo "Upstream is at $(git log -1 --format='%h %s' refs/fork/upstream)"

      - name: Update the upstream mirror branch
        if: ${{ env.UPDATE_MIRROR == 'true' }}
        run: git push origin refs/fork/upstream:refs/heads/upstream

      - name: Rebase the patch stack
        id: rebase
        env:
          CONFLICT_REPORT: ${{ runner.temp }}/conflict.md
        # The rebase rewrites the working tree, so the script runs from a copy.
        run: |
          cp .github/scripts/fork-rebase-onto-upstream.sh "${RUNNER_TEMP}/"
          "${RUNNER_TEMP}/fork-rebase-onto-upstream.sh" "origin/${STACK_BRANCH}" refs/fork/upstream

      # refs/fork/rebased-from tells fork-ci.yml which master the stack came from, so that it only replaces that one.
      # It is pushed first, because the auto-rebase push starts CI.
      - name: Push the rebased stack
        run: |
          git push --force origin "origin/${STACK_BRANCH}:refs/fork/rebased-from"
          git push --force origin HEAD:refs/heads/auto-rebase

      - name: Report the conflict
        if: ${{ failure() && steps.rebase.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .github/scripts/fork-report-rebase-failure.sh \
            "The daily rebase onto upstream has a conflict" \
            "$(cat "${RUNNER_TEMP}/conflict.md")"$'\n\n'"Run: ${RUN_URL}"

      - name: Report any other failure
        if: ${{ failure() && steps.rebase.outcome != 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          .github/scripts/fork-report-rebase-failure.sh \
            "The daily rebase job failed" \
            "The job failed before or after the rebase itself: ${RUN_URL}"
